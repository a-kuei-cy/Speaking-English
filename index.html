<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>興嘉國小 - 數位口說檢核</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

  <script>
    // ==========================================
    // ⚠️ 請在這裡填入您的 Google Apps Script 部署網址
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFMjcJ4S3bJbWJ81j8ISTtA2iKPnKmuqkHmzn8_UFuZ6hPtp1vIvgx_r6vbgSChrbLWw/exec"; 

    // 全域變數
    let questionsData = [];
    let mediaRecorder;
    let audioChunks = [];
    let audioBlob;
    let audioBase64;
    
    // 頁面載入時執行
    window.onload = () => {
      fetchQuestions();
    };

    // 切換頁籤功能
    function switchTab(tabName) {
      if (tabName === 'test') {
        document.getElementById('tab-test').classList.add('border-blue-600', 'text-blue-600');
        document.getElementById('tab-test').classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        document.getElementById('tab-query').classList.remove('border-blue-600', 'text-blue-600');
        document.getElementById('tab-query').classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        
        document.getElementById('section-test').classList.remove('hidden');
        document.getElementById('section-query').classList.add('hidden');
      } else {
        document.getElementById('tab-query').classList.add('border-blue-600', 'text-blue-600');
        document.getElementById('tab-query').classList.remove('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        document.getElementById('tab-test').classList.remove('border-blue-600', 'text-blue-600');
        document.getElementById('tab-test').classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
        
        document.getElementById('section-query').classList.remove('hidden');
        document.getElementById('section-test').classList.add('hidden');
      }
    }

    // --- 測驗功能區塊 ---
    async function fetchQuestions() {
      const selectElement = document.getElementById('questionSelect');
      selectElement.innerHTML = '<option>載入題目中...</option>';
      selectElement.disabled = true;

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=getQuestions`);
        const result = await response.json();
        
        if (result.status === 'success') {
          questionsData = result.data;
          selectElement.innerHTML = '<option value="">-- 請選擇今天的挑戰句 --</option>';
          questionsData.forEach(q => {
            selectElement.innerHTML += `<option value="${q.id}">[${q.grade}] ${q.english}</option>`;
          });
          selectElement.disabled = false;
        } else {
          selectElement.innerHTML = `<option>載入失敗: ${result.message}</option>`;
        }
      } catch (error) {
        selectElement.innerHTML = '<option>載入失敗，請檢查網址或重新整理頁面</option>';
        console.error("Fetch Error:", error);
      }
    }

    function showTranslation() {
      const select = document.getElementById('questionSelect');
      const translationDiv = document.getElementById('translationDisplay');
      const selectedId = select.value;

      if (!selectedId) {
        translationDiv.innerHTML = '';
        return;
      }
      const question = questionsData.find(q => q.id === selectedId);
      if (question) {
        translationDiv.innerHTML = `<p class="text-blue-600 font-medium bg-blue-50 p-3 rounded-lg border border-blue-100"><i class="fas fa-language mr-2"></i>中文：${question.chinese}</p>`;
      }
    }

    // 錄音相關
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.addEventListener("dataavailable", event => {
          audioChunks.push(event.data);
        });

        mediaRecorder.addEventListener("stop", () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const audioUrl = URL.createObjectURL(audioBlob);
          const audioPlayback = document.getElementById("audioPlayback");
          audioPlayback.src = audioUrl;
          audioPlayback.classList.remove('hidden');
          document.getElementById('uploadBtn').disabled = false;
          
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = function() {
            audioBase64 = reader.result;
          }
        });

        mediaRecorder.start();
        document.getElementById("startRecordBtn").classList.add('hidden');
        document.getElementById("stopRecordBtn").classList.remove('hidden');
        document.getElementById("recordingStatus").classList.remove('hidden');
      } catch (err) {
        alert("無法存取麥克風，請確認權限設定。");
        console.error(err);
      }
    }

    function stopRecording() {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
      document.getElementById("startRecordBtn").classList.remove('hidden');
      document.getElementById("stopRecordBtn").classList.add('hidden');
      document.getElementById("recordingStatus").classList.add('hidden');
    }

    async function uploadAudio() {
      const studentId = document.getElementById('studentId').value;
      const name = document.getElementById('studentName').value;
      const selectedId = document.getElementById('questionSelect').value;

      if (!studentId || !name || !selectedId || !audioBase64) {
        alert("請確認班級座號、姓名、題目皆已填寫，且已完成錄音！");
        return;
      }

      const question = questionsData.find(q => q.id === selectedId);
      const sentence = question ? question.english : '';

      const btn = document.getElementById('uploadBtn');
      const statusDiv = document.getElementById('uploadStatus');
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>上傳中...';
      statusDiv.classList.add('hidden');

      const payload = {
        action: 'uploadRecord',
        studentId: studentId,
        name: name,
        questionId: selectedId,
        sentence: sentence,
        audioBase64: audioBase64
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          statusDiv.innerHTML = '<i class="fas fa-check-circle mr-2"></i>上傳成功！老師已經收到你的錄音囉 🎉';
          statusDiv.className = "mt-4 p-4 rounded-lg bg-green-100 text-green-700 text-center font-bold";
          statusDiv.classList.remove('hidden');
          
          // 重置錄音區塊
          document.getElementById('audioPlayback').classList.add('hidden');
          audioBase64 = null;
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>上傳失敗：${error.message}`;
        statusDiv.className = "mt-4 p-4 rounded-lg bg-red-100 text-red-700 text-center font-bold";
        statusDiv.classList.remove('hidden');
      } finally {
        btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i>上傳口說錄音';
        btn.disabled = audioBase64 == null; // 只有在沒音檔時才鎖住
      }
    }

    // --- 查詢成績功能區塊 ---
    async function queryScore() {
      const queryId = document.getElementById('queryStudentId').value;
      const resultDiv = document.getElementById('queryResult');
      const resultBody = document.getElementById('queryResultBody');
      const queryBtn = document.getElementById('queryBtn');

      if (!queryId) {
        alert("請輸入要查詢的班級座號！");
        return;
      }

      queryBtn.disabled = true;
      queryBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>查詢中...';
      resultDiv.classList.add('hidden');
      resultBody.innerHTML = '';

      try {
        const response = await fetch(`${GAS_WEB_APP_URL}?action=checkStatus&studentId=${queryId}`);
        const result = await response.json();
        
        if (result.status === 'success') {
          if (result.data.length === 0) {
            resultBody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">找不到座號 ${queryId} 的紀錄，請確認是否有上傳過錄音喔！</td></tr>`;
          } else {
            result.data.forEach(record => {
              // 根據狀態設定顏色
              let statusColor = "text-gray-500 bg-gray-100";
              if(record.status.includes("通過")) statusColor = "text-green-700 bg-green-100 font-bold";
              else if(record.status.includes("加油")) statusColor = "text-red-700 bg-red-100 font-bold";
              else if(record.status.includes("待審核")) statusColor = "text-yellow-700 bg-yellow-100";

              let pointsDisplay = record.points > 0 ? `<span class="text-yellow-600 font-bold"><i class="fas fa-star mr-1"></i>${record.points} 點</span>` : `<span class="text-gray-400">-</span>`;

              const tr = document.createElement('tr');
              tr.className = "border-b border-gray-200 hover:bg-gray-50";
              tr.innerHTML = `
                <td class="px-4 py-3 text-sm text-gray-600">${record.time}</td>
                <td class="px-4 py-3 text-sm font-medium text-gray-800">${record.sentence}</td>
                <td class="px-4 py-3 text-sm text-center">
                  <span class="px-2 py-1 rounded-full text-xs ${statusColor}">${record.status}</span>
                </td>
                <td class="px-4 py-3 text-sm text-center">${pointsDisplay}</td>
              `;
              resultBody.appendChild(tr);
            });
          }
          resultDiv.classList.remove('hidden');
        } else {
          alert(`查詢失敗: ${result.message}`);
        }
      } catch (error) {
        alert("查詢發生錯誤，請檢查網路連線。");
        console.error(error);
      } finally {
        queryBtn.innerHTML = '<i class="fas fa-search mr-2"></i>查詢成績';
        queryBtn.disabled = false;
      }
    }
  </script>

  <!-- 頁面標題 -->
  <header class="bg-white shadow-sm border-b border-gray-200 pt-8 pb-4">
    <div class="max-w-3xl mx-auto px-4 text-center">
      <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Xingjia Elementary</span>
      <h1 class="text-3xl font-extrabold text-gray-900 mt-3 mb-2">數位口說檢核系統</h1>
      <p class="text-gray-500 text-sm">請選擇測驗或查詢您的錄音成績</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    
    <!-- 分頁導覽列 -->
    <div class="border-b border-gray-200 mb-6">
      <nav class="-mb-px flex space-x-8 justify-center" aria-label="Tabs">
        <button onclick="switchTab('test')" id="tab-test" class="border-blue-600 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center">
          <i class="fas fa-microphone-alt mr-2"></i>我要測驗
        </button>
        <button onclick="switchTab('query')" id="tab-query" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg flex items-center">
          <i class="fas fa-search mr-2"></i>查詢成績
        </button>
      </nav>
    </div>

    <!-- ==================== 測驗區塊 ==================== -->
    <div id="section-test" class="bg-white rounded-2xl shadow-xl p-6 md:p-10 border border-gray-100">
      
      <!-- 學生資料 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">班級座號 (例如: 50101)</label>
          <input type="number" id="studentId" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" placeholder="請輸入班級與座號">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">姓名</label>
          <input type="text" id="studentName" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" placeholder="請輸入姓名">
        </div>
      </div>

      <hr class="border-gray-100 my-8">

      <!-- 選擇題目 -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-gray-700 mb-2">選擇挑戰句</label>
        <select id="questionSelect" onchange="showTranslation()" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm font-medium text-gray-800 transition">
          <option>載入題目中...</option>
        </select>
        <div id="translationDisplay" class="mt-3"></div>
      </div>

      <!-- 錄音區塊 -->
      <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-8 flex flex-col items-center">
        <div id="recordingStatus" class="hidden mb-4 flex items-center text-red-600 font-bold animate-pulse">
          <div class="w-3 h-3 bg-red-600 rounded-full mr-2"></div>正在錄音中...
        </div>
        
        <button id="startRecordBtn" onclick="startRecording()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 flex items-center text-lg">
          <i class="fas fa-microphone mr-3 text-xl"></i>開始錄音
        </button>
        
        <button id="stopRecordBtn" onclick="stopRecording()" class="hidden bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl transition flex items-center text-lg">
          <i class="fas fa-stop mr-3 text-xl"></i>停止錄音
        </button>

        <audio id="audioPlayback" controls class="hidden mt-6 w-full max-w-md shadow-sm rounded-full"></audio>
      </div>

      <!-- 上傳按鈕 -->
      <button id="uploadBtn" onclick="uploadAudio()" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-xl shadow-md transition text-lg flex items-center justify-center">
        <i class="fas fa-cloud-upload-alt mr-2"></i>上傳口說錄音
      </button>

      <div id="uploadStatus" class="hidden mt-4"></div>
    </div>

    <!-- ==================== 查詢成績區塊 ==================== -->
    <div id="section-query" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 border border-gray-100">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
          <i class="fas fa-search-dollar text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">查詢我的成績與點數</h2>
        <p class="text-gray-500 mt-2">輸入座號即可查看老師批改的結果喔！</p>
      </div>

      <div class="flex flex-col md:flex-row gap-4 mb-8">
        <input type="number" id="queryStudentId" class="flex-1 px-4 py-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-lg shadow-sm" placeholder="請輸入班級座號 (例如: 50101)">
        <button id="queryBtn" onclick="queryScore()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-md transition text-lg flex items-center justify-center whitespace-nowrap">
          <i class="fas fa-search mr-2"></i>查詢成績
        </button>
      </div>

      <!-- 查詢結果表格 -->
      <div id="queryResult" class="hidden">
        <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
          <table class="min-w-full bg-white">
            <thead class="bg-gray-50 border-b border-gray-200">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">上傳時間</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">挑戰句</th>
                <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">老師審核</th>
                <th class="px-4 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">獲得點數</th>
              </tr>
            </thead>
            <tbody id="queryResultBody" class="divide-y divide-gray-200">
              <!-- 透過 JS 動態產生資料 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</body>
</html>
